<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Account Creation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <p class="id-line">Student ID: <span id="studentId">—</span></p>

  <form id="studentForm" novalidate>
    <div class="grid">
      <!-- COLUMN 1 -->
      <div class="col">
        <label class="lbl">Name</label>
        <input type="text" id="lastName"   placeholder="Last name"  required>
        <input type="text" id="firstName"  placeholder="First name" required>
        <input type="text" id="middleName" placeholder="Middle name (optional)">
        <input type="text" id="suffix"     placeholder="Suffix name (Jr., II. etc.)">

        <label class="lbl" style="margin-top:34px">Birthday</label>
        <input type="date" id="birthday" required>

        <label class="lbl">Contact No.</label>
        <input type="tel" id="contact" inputmode="tel" placeholder="09XXXXXXXXX" required>
      </div>

      <!-- COLUMN 2 -->
      <div class="col">
        <label class="lbl">Email</label>
        <input type="email" id="email" required>

        <label class="lbl">Temporary Password</label>
        <!-- Auto-generated by the database: not typed by the user -->
        <input type="text" id="tempPw" readonly placeholder="Auto-generated" tabindex="-1">

        <label class="lbl">Program</label>
        <select id="program" required>
          <option value="">Select</option>
          <option value="1">BS Information Technology</option>
          <option value="2">BS Business Administration</option>
          <option value="3">BS Education</option>
          <option value="4">BS Accountancy</option>
          <option value="5">BS Hospitality Management</option>
        </select>

        <label class="lbl" style="margin-top:12px">Guardian Name</label>
        <input type="text" id="guardian" placeholder="LN, FN MN" required>

        <label class="lbl">Contact No.</label>
        <input type="tel" id="guardianContact" inputmode="tel" placeholder="09XXXXXXXXX" required>
      </div>

      <!-- COLUMN 3: classification -->
      <div class="col">
        <div class="panel">
          <div class="split">
            <!-- Misaligned NSHSBP -->
            <div class="cell">
              <label class="head"><input type="checkbox" id="chkNshsbp" data-group="align">
                <span>Misaligned (NSHSBP)<small>Non-Senior High School Bridging Program</small></span></label>
              <div class="sub">Additional five (5) subjects</div>
              <label class="opt"><input type="radio" name="nshsbp" value="BTZ" disabled> Back to Zero (BTZ)</label>
              <label class="opt"><input type="radio" name="nshsbp" value="ALS_GRADUATE" disabled> ALS Graduate</label>
              <label class="opt"><input type="radio" name="nshsbp" value="HSG" disabled> High School Graduate (HSG)</label>
            </div>
            <!-- Misaligned SHSBP -->
            <div class="cell">
              <label class="head"><input type="checkbox" id="chkShsbp" data-group="align">
                <span>Misaligned (SHSBP)<small>Senior High School Bridging Program</small></span></label>
              <div class="sub">Additional three (3) subjects</div>
              <label class="opt"><input type="radio" name="shsbp" value="FORMER_SHS" disabled> Former SHS Bridging Program</label>
              <label class="opt"><input type="radio" name="shsbp" value="SHS" disabled> SHS Bridging Program</label>
            </div>
          </div>
          <div class="aligned">
            <label class="head"><input type="checkbox" id="chkAligned" data-group="align"> <span>Aligned</span></label>
            <div class="row">
              <label class="opt"><input type="radio" name="aligned" value="FORMER_SHS" disabled> Former SHS</label>
              <label class="opt"><input type="radio" name="aligned" value="SHS" disabled> SHS</label>
            </div>
          </div>
        </div>

        <div class="panel pad">
          <div class="row">
            <label class="opt"><input type="checkbox" id="chkFreshmen"   data-group="type"> Freshmen</label>
            <label class="opt"><input type="checkbox" id="chkTransferee" data-group="type"> Transferee</label>
          </div>
        </div>

        <div class="panel pad">
          <label class="lbl">Entrance Exam Score</label>
          <input type="number" id="examScore" min="0" max="100" step="0.01">
        </div>
      </div>

      <!-- ADDRESS (spans two columns) -->
      <div class="wide">
        <label class="lbl">Address</label>
        <input type="text" id="address" required>
      </div>
    </div>

    <div class="error" id="formError"></div>
    <div class="full-btn-row"><button type="submit" class="btn">Create Account</button></div>
  </form>
</main>

<script src="js/app.js"></script>
<script>
  buildHeader('Student Account Creation', 'student-create.html');
  setToday(birthday);
  studentId.textContent = db.nextId('student');       // preview of next AUTO_INCREMENT id

  /* Checkboxes in the same group behave like radio buttons (pick one). */
  document.querySelectorAll('input[type=checkbox][data-group]').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) document.querySelectorAll(`input[data-group="${cb.dataset.group}"]`).forEach(o => { if (o !== cb) o.checked = false; });
      syncRadios();
    });
  });
  /* Sub-options are enabled only when their box is ticked. */
  function syncRadios() {
    [['chkNshsbp', 'nshsbp'], ['chkShsbp', 'shsbp'], ['chkAligned', 'aligned']].forEach(([box, name]) => {
      const on = document.getElementById(box).checked;
      document.querySelectorAll(`input[name=${name}]`).forEach(r => { r.disabled = !on; if (!on) r.checked = false; });
    });
  }

  studentForm.addEventListener('submit', e => {
    e.preventDefault();
    const err = m => { formError.textContent = m; formError.style.display = 'block'; };
    formError.style.display = 'none';

    if (!lastName.value.trim() || !firstName.value.trim()) return err('Last name and first name are required.');
    if (!/^\S+@\S+\.\S+$/.test(email.value)) return err('Enter a valid email address.');
    if (!program.value) return err('Please select a program.');
    if (!birthday.value) return err('Please enter the birthday.');
    if (!validPhone(contact.value)) return err('Student contact no. must look like 09XXXXXXXXX.');
    if (!guardianOk(guardian.value)) return err('Guardian name must follow the format: LN, FN MN.');
    if (!validPhone(guardianContact.value)) return err('Guardian contact no. must look like 09XXXXXXXXX.');
    if (!address.value.trim()) return err('Address is required.');
    if (!chkFreshmen.checked && !chkTransferee.checked) return err('Select Freshmen or Transferee.');

    let alignment, bridging = null, background, extra = 0;
    if (chkNshsbp.checked) {
      background = document.querySelector('input[name=nshsbp]:checked')?.value;
      if (!background) return err('Choose BTZ, ALS Graduate or HSG under Misaligned (NSHSBP).');
      alignment = 'Misaligned'; bridging = 'NSHSBP'; extra = 5;
    } else if (chkShsbp.checked) {
      background = document.querySelector('input[name=shsbp]:checked')?.value;
      if (!background) return err('Choose an option under Misaligned (SHSBP).');
      alignment = 'Misaligned'; bridging = 'SHSBP'; extra = 3;
    } else if (chkAligned.checked) {
      background = document.querySelector('input[name=aligned]:checked')?.value;
      if (!background) return err('Choose Former SHS or SHS under Aligned.');
      alignment = 'Aligned';
    } else return err('Select Aligned or a Misaligned category.');

    const score = examScore.value === '' ? null : +examScore.value;
    if (score !== null && (score < 0 || score > 100)) return err('Entrance exam score must be 0–100.');

    // ---- DEMO save. Real version: call sp_create_student(...) on the server ----
    const id = String(db.nextId('student'));
    const pw = db.tempPassword();
    db.addUser({ id, role: 'student', password: pw, email: email.value.trim(),
      lastName: lastName.value.trim(), firstName: firstName.value.trim(), middleName: middleName.value.trim(),
      suffix: suffix.value.trim(), birthday: birthday.value, contact: contact.value, address: address.value.trim(),
      guardian: guardian.value.trim(), guardianContact: guardianContact.value, program: program.value,
      studentType: chkFreshmen.checked ? 'Freshmen' : 'Transferee', alignment, bridging, background, extra, score });

    toast(`Account created.<br>Student ID: <b>${id}</b><br>Temporary password: <b>${pw}</b><br>Give these to the student — the password is shown only once.`);
    tempPw.value = pw;
    studentForm.reset(); syncRadios();
    studentId.textContent = db.nextId('student');
  });
</script>
</body>
</html>
