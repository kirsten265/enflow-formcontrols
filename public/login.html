<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Mary The Queen College of Quezon City</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login">
    <!-- Put the school logo file at images/logo.png -->
    <img src="images/logo.png" alt="Mary The Queen College of Quezon City logo">
    <form id="loginForm" autocomplete="off">
      <input type="text" id="username" name="username" placeholder="Username" required>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <a class="recover" href="#" id="recover">Recover an account?</a>
      <div class="error" id="err">Invalid username or password.</div>
      <button type="submit" class="btn-blue">LOGIN</button>
    </form>
  </div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      err.style.display = 'none';
      try {
        await api.post('/api/login', { username: username.value.trim(), password: password.value });
        location.href = 'student-create.html';
      } catch (ex) { err.textContent = ex.message; err.style.display = 'block'; }
    });
    recover.onclick = e => { e.preventDefault(); alert('Please contact the Registrar to reset your account.'); };
</script>
</body>
</html>
