<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Account Creation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <p class="id-line">Staff ID: <span id="staffId">—</span></p>

  <form id="staffForm" novalidate>
    <div class="grid two">
      <!-- Name fields -->
      <div class="col">
        <label class="lbl">Name</label>
        <input type="text" id="lastName"   placeholder="Last name"  required>
        <input type="text" id="firstName"  placeholder="First name" required>
        <input type="text" id="middleName" placeholder="Middle name (optional)">
        <input type="text" id="suffix"     placeholder="Suffix name (Jr., II. etc.)">
      </div>
      <!-- Account details: email, temporary password, department -->
      <div class="col">
        <label class="lbl">Email</label>
        <input type="email" id="email" required>

        <label class="lbl">Temporary Password</label>
        <!-- Auto-generated by the database -->
        <input type="text" id="tempPw" readonly placeholder="Auto-generated" tabindex="-1">

        <label class="lbl">Department</label>
        <select id="department" required>
          <option value="">Select</option>
          <option value="1">Registrar</option>
          <option value="2">Accounting</option>
          <option value="3">Admissions</option>
          <option value="4">Guidance</option>
          <option value="5">IT Office</option>
          <option value="6">Faculty</option>
        </select>
      </div>

      <!-- Personal details: birthday, contact number, address -->
      <div class="wide" style="margin-top:22px">
        <label class="lbl">Birthday</label>
        <input type="date" id="birthday" required>

        <label class="lbl">Contact No.</label>
        <input type="tel" id="contact" inputmode="tel" placeholder="09XXXXXXXXX" required>

        <label class="lbl">Address</label>
        <input type="text" id="address" required>
      </div>
    </div>

    <!-- Validation error message -->
    <div class="error" id="formError"></div>
    <!-- Submit button -->
    <div class="full-btn-row"><button type="submit" class="btn">Create Account</button></div>
  </form>
</main>

<!-- Shared helpers: api, toast, buildHeader, setToday, fillSelect, validPhone, cleanPhone -->
<script src="js/app.js"></script>
<script>
  buildHeader('Staff Account Creation', 'staff-create.html');
  setToday(birthday);
  fillSelect(department, '/api/departments', 'department_id', 'department_name');
  async function refreshId() {
    try { staffId.textContent = (await api.get('/api/next-id/staff')).id; }
    catch { staffId.textContent = '—'; }
  }
  refreshId();

  staffForm.addEventListener('submit', async e => {
    e.preventDefault();
    const err = m => { formError.textContent = m; formError.style.display = 'block'; };
    formError.style.display = 'none';

    if (!lastName.value.trim() || !firstName.value.trim()) return err('Last name and first name are required.');
    if (!/^\S+@\S+\.\S+$/.test(email.value)) return err('Enter a valid email address.');
    if (!department.value) return err('Please select a department.');
    if (!birthday.value) return err('Please enter the birthday.');
    if (!validPhone(contact.value)) return err('Contact no. must look like 09XXXXXXXXX.');
    if (!address.value.trim()) return err('Address is required.');

    try {
      const res = await api.post('/api/staff', {
        lastName: lastName.value.trim(), firstName: firstName.value.trim(),
        middleName: middleName.value.trim(), suffix: suffix.value.trim(),
        email: email.value.trim(), departmentId: +department.value, birthday: birthday.value,
        contact: cleanPhone(contact.value), address: address.value.trim(),
      });
      toast(`Account created.<br>Staff ID: <b>${res.staff_id}</b><br>Temporary password: <b>${res.temporary_password}</b><br>Give these to the staff member — the password is shown only once.`, 20000);
      staffForm.reset(); refreshId();
    } catch (ex) { err(ex.message); }
  });
</script>
</body>
</html>
